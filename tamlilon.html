<style>
:root{
  --bg:#fbfaf6; --ink:#1d1d1f; --muted:#68686e; --line:#e4e0d6; --panel:#ffffff; --soft:#f4f2ec;
  --hl:#ffe9a8; --done:#8a8a8f; --accent:#275882; --brand:#1f3d5c; --amber:#f2b632; --amber-ink:#a86b0c;
  --green:#2f7d4f; --attn:#c62828; --warn-bg:#fff4e5;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Sans Hebrew","Arial Hebrew",sans-serif;
  --read:Georgia,"Times New Roman","Noto Serif Hebrew",serif;
  --fs:26px; --cfs:40px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--read)}
body{display:flex;flex-direction:column}
.ui,header,#panel,#modal,.step,#banner,#editbar,#toast{font-family:var(--ui)}
[dir=auto]{unicode-bidi:plaintext}
/* Hebrew notes (even with French words inside) and a right-to-left text read in the right order, starting on the right */
ul.notes li,.doc .box > div,#text p,#ctext p,#panel .fr{unicode-bidi:plaintext;text-align:start}
body.ro .noro,.onlyro{display:none} body.ro .onlyro{display:block}
button{font:inherit;cursor:pointer}
kbd{font:12px Menlo,Consolas,monospace;border:1px solid #ccc;border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff;color:var(--ink)}
header{flex:none;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(31,61,92,.06)}
.brand{flex:none;display:flex;align-items:center;gap:9px;padding-right:14px;border-right:1px solid var(--line);color:var(--brand);line-height:1.05}
.brand svg{width:32px;height:32px;display:block}
.brand b{display:block;font-size:17px;letter-spacing:-.2px}
.brand span{display:block;font-size:13px;font-weight:bold;color:var(--amber-ink)}
header h1{font-size:20px;margin:0;font-family:var(--read);font-weight:normal;color:var(--ink)}
header .tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
header button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 11px;font-size:15px;color:var(--ink);transition:background .15s,border-color .15s}
header button:hover{background:var(--soft);border-color:#d3cec2}
header .tools button.on{background:var(--brand);border-color:var(--brand);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
#saveb.dirty{background:#fff1d6;border-color:#e0a32e;font-weight:bold}
#projdot{color:#aaa} #projdot.on{color:var(--green)}
nav#tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:11px;padding:3px}
nav#tabs button{border-color:transparent;background:transparent}
nav#tabs button:hover{background:#fff;border-color:var(--line)}
nav#tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 2px rgba(31,61,92,.25)}
nav#tabs button[draggable=true]{cursor:grab}
nav#tabs button.dragging{opacity:.4}
nav#tabs button.dropL{box-shadow:-4px 0 0 var(--accent)}
nav#tabs button.dropR{box-shadow:4px 0 0 var(--accent)}
nav#tabs .tabx{margin-left:6px;padding:0 5px;color:var(--attn)}
#addtab{font-weight:bold;color:var(--accent)}
#banner{display:none;flex:none;background:var(--warn-bg);border-bottom:1px solid #f0c98a;padding:8px 16px;font-size:15px;gap:10px;align-items:center;flex-wrap:wrap}
#banner.on{display:flex}
#banner button{border:1px solid #d9a24a;background:#fff;border-radius:7px;padding:3px 10px}
#editbar{display:none;flex:none;background:#fff8e1;border-bottom:1px solid #f0d58a;padding:7px 16px;font-size:15px;gap:10px;align-items:center;flex-wrap:wrap}
body.editing #editbar{display:flex}
#editbar button{border:1px solid #d9b95a;background:#fff;border-radius:6px;padding:3px 12px;font-weight:bold}
main{flex:1;min-height:0}
.view{display:none;height:100%}
.view.on{display:flex}
/* reading */
#text{flex:1 1 58%;overflow-y:auto;padding:24px 40px 40vh 40px;font-size:var(--fs);line-height:1.75}
#text p{margin:0 0 .9em 0;text-indent:1.5em}
.empty{font-family:var(--ui);font-size:18px;color:var(--muted);text-indent:0;padding:40px 0}
.empty button{border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:8px;padding:6px 14px;font-size:16px}
.s{border-radius:6px;padding:1px 2px;cursor:pointer;transition:background .15s}
.s:hover{background:#f1efe7}
.s.read{color:var(--done)}
.s.cur{background:var(--hl);color:var(--ink);box-shadow:0 0 0 2px #f3d67a}
.s .num{display:none;font-family:var(--ui);font-size:.5em;color:var(--accent);vertical-align:super;margin-right:2px}
body.nums .s .num{display:inline}
.w{border-radius:3px}
.w:hover{background:#cfe2f5;color:#000}
body.editing .w{cursor:text}
body.editing .w:hover{outline:2px dashed #d9b95a}
.w.spot{background:var(--accent);color:#fff;border-radius:4px;padding:0 2px}
#panel{flex:1 1 42%;max-width:720px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:18px 22px;font-size:calc(var(--fs)*.72)}
#panel .fr{font-family:var(--read);font-size:calc(var(--fs)*.85);line-height:1.5;margin:6px 0 10px}
.meta{color:var(--muted);font-size:.8em}
.navrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.navrow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 14px;font-size:1em}
.sec{border-top:1px solid var(--line);padding:12px 0;display:none}
.sec.on{display:block}
body.editing .sec{display:block}
.sec h3{margin:0 0 8px;font-size:.8em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:8px}
.trl{margin:0 0 10px}
.lab{display:block;color:var(--muted);font-size:.7em;text-transform:uppercase;letter-spacing:.05em}
.trt{font-size:1.1em;line-height:1.55}
ul.notes{list-style:none;padding:0;margin:0}
ul.notes li{margin:0 0 10px;line-height:1.45}
.tag{display:inline-block;font-size:.72em;border-radius:4px;padding:1px 6px;margin-right:6px;color:#fff;vertical-align:1px;background:#888;font-family:var(--ui)}
.tag.expr{background:#2f5d8a}.tag.ety{background:#5b7f3a}.tag.q{background:#a3472f}.tag.ctx{background:#7a5a96}.tag.gram{background:#b07d12}.tag.rem{background:#777}
.reveal{border:1px solid #cfdceb;background:#f3f7fb;border-radius:10px;padding:8px 10px;margin:6px 0 12px;font-size:.85em}
.reveal .rr,.reveal .rh{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;gap:6px;margin:4px 0}
.reveal .rh{color:var(--muted);font-size:.8em;text-align:center}
.reveal .rh span:first-child{text-align:left}
.reveal button{border:1px solid #cfdceb;background:#fff;border-radius:7px;padding:3px 0}
.reveal button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.reveal button.cl.on{background:var(--green);border-color:var(--green)}
.reveal kbd{margin-left:4px}
.reveal .wordrow{margin-top:6px;color:var(--muted)}
.reveal .wordrow button{border:1px solid #cfdceb;background:#fff;border-radius:6px;padding:0 8px}
.ed{display:none;border:1px solid #d9b95a;background:#fff8e1;color:#7a5a00;border-radius:6px;font-size:13px;padding:2px 9px;font-family:var(--ui);text-transform:none;letter-spacing:0;font-weight:normal}
body.editing .ed{display:inline-block}
/* tooltip */
#tip{position:fixed;z-index:20;display:none;background:#1d1d1f;color:#fff;border-radius:10px;padding:10px 14px;font-family:var(--ui);font-size:calc(var(--fs)*.68);max-width:460px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;line-height:1.4}
#tip .tw{font-family:var(--read);font-size:1.15em;font-weight:bold}
#tip .tl{margin:3px 0}
#tip .tl small{color:#aab;font-size:.7em;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
#tip .tp{color:#cfd8e3}
#tip .tn{color:#f3d67a;font-size:.85em;margin-top:4px}
#tip .tm{color:#f3a9a9}
/* doc views (setup, words, your tabs) */
.doc{overflow-y:auto;width:100%;padding:24px 40px 80px;font-size:calc(var(--fs)*.8);line-height:1.6}
.doc .inner{max-width:1000px;margin:0 auto}
.doc h2{font-size:1.5em;margin:.2em 0 .4em}
.doc h3{font-size:1.1em;margin:0 0 .4em;color:var(--accent);display:flex;gap:10px;align-items:center}
.doc .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 22px;margin:14px 0}
.doc .hid{display:none;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.doc .hid.on{display:block}
.doc .hid.ans{background:#f3f7fb;border-left:4px solid var(--accent);padding:6px 12px}
.doc button.show{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:.75em;padding:2px 10px;font-family:var(--ui)}
.doc a{color:var(--accent);cursor:pointer;text-decoration:underline}
/* setup */
#setup{font-family:var(--ui);font-size:17px;line-height:1.5}
.welcome{background:#eef4fa;border:1px solid #cfdceb;border-radius:14px;padding:12px 18px;margin-bottom:10px}
.welcome button,.btnrow button,.howto button,#setup details button{border:1px solid #c4c0b6;background:#fff;border-radius:9px;padding:6px 14px;font-size:16px}
.welcome button:hover,.btnrow button:hover,.howto button:hover,#setup details button:hover{background:var(--soft)}
#setup button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:bold}
#setup button.primary:hover{background:var(--brand)}
.step{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin:14px 0;box-shadow:0 1px 3px rgba(31,61,92,.05)}
.step.dim{opacity:.55}
.step .sn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;font-weight:bold;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 var(--amber)}
.credit{font-family:var(--ui);font-size:13px;color:var(--muted);text-align:center;margin:26px 0 0;line-height:1.6}
.credit a{color:var(--accent)}
#modal .credit{text-align:start;font-size:14px;margin-top:6px}
.step .sb{flex:1;min-width:0}
.step h3{margin:4px 0 8px;font-size:20px;color:var(--ink)}
.step p{margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px}
.grid label{display:block;font-weight:bold;font-size:15px}
.checks{font-size:15px}.checks b{display:block}.checks .help{color:var(--muted);font-size:13px}
.checks label{display:flex;align-items:center;gap:6px;font-weight:normal;font-size:16px;margin:3px 0;cursor:pointer}
.checks input{width:18px;height:18px;margin:0}
.grid input:not([type=checkbox]),.grid select{display:block;width:100%;margin-top:4px;font:17px var(--ui);padding:7px 9px;border:1px solid #bbb;border-radius:8px;background:#fff}
#setup textarea{width:100%;font:17px/1.55 var(--read);border:1px solid #bbb;border-radius:8px;padding:10px 12px}
.btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.msg{font-size:15px}
.msg.good,.ok{color:var(--green);font-weight:bold}
.msg.bad{color:var(--attn);font-weight:bold}
.prog{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;align-items:center;margin:4px 0 12px;font-size:16px}
.bar{height:14px;background:#eee;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.howto li{margin:6px 0}
/* words table */
table.wt{border-collapse:collapse;width:100%;font-size:.9em}
table.wt th{text-align:left;font:bold 13px var(--ui);color:var(--muted);border-bottom:2px solid var(--line);padding:4px 8px}
table.wt td{border-bottom:1px solid var(--line);padding:4px 8px;vertical-align:top}
table.wt td.wf{font-weight:bold}
table.wt tr.miss td.wf::after{content:" missing";color:var(--attn);font:12px var(--ui);font-weight:normal}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
#modal.on{display:flex}
#modal .card{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:18px 22px;font-size:16px;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#modal h2{margin:0 0 10px;font-size:20px}
#modal h3{margin:18px 0 6px;font-size:17px;color:var(--accent)}
#modal label{display:block;font-weight:bold;margin:12px 0 4px}
#modal .help{font-weight:normal;color:var(--muted);font-size:13px;margin-left:6px}
#modal textarea,#modal input[type=text]{width:100%;font:16px/1.45 var(--ui);border:1px solid #bbb;border-radius:6px;padding:7px 9px}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#modal .row button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:7px 16px}
#modal .row button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:bold}
#modal .row button.danger{color:var(--attn);border-color:var(--attn);margin-right:auto}
#modal .src{font-family:var(--read);font-size:18px;background:#f6f5f1;border-radius:8px;padding:8px 12px}
#modal table{border-collapse:collapse} #modal td{padding:3px 10px 3px 0;vertical-align:top}
.ncard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0;background:#fcfcfa}
.nhead{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.nhead select{font:15px var(--ui);padding:3px 6px;border-radius:6px}
.nhead button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:2px 9px;min-width:32px}
.nhead .sp{flex:1}
.presets,.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.presets button{border:1px solid #cfdceb;background:#f3f7fb;border-radius:8px;padding:6px 12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-family:var(--read)}
.lab2{font-weight:bold;margin-top:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1f;color:#fff;border-radius:10px;padding:10px 18px;font-size:16px;z-index:40;display:none;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
/* class (projector) window */
#classview{display:none}
body.classmode header,body.classmode #banner,body.classmode #editbar,body.classmode main,body.classmode #tip{display:none}
body.classmode #classview{display:flex;flex-direction:column;height:100vh}
#ctext{flex:1;overflow-y:auto;padding:5vh 7vw 35vh;font-size:var(--cfs);line-height:1.7}
#ctext p{margin:0 0 .8em;text-indent:1.5em}
#ctext .s{cursor:default}
#ctext .s:not(.cur):hover{background:none}
#cbar{background:#fff;border-top:3px solid var(--line);padding:1.2vh 7vw 2vh;font-family:var(--ui);font-size:calc(var(--cfs)*.6);line-height:1.45;max-height:42vh;overflow-y:auto}
#cbar:empty{display:none}
#cbar .row{margin:.3em 0}
#cbar .lab{display:inline;margin-right:.6em}
#cbar .ctr{font-size:1.1em}
#cbar .ctr+.ctr{color:#555;font-size:.9em}
#cbar ul.notes li{margin:.25em 0}
#cbar .cw{font-size:1.15em;background:#eef4fa;border-radius:10px;padding:.2em .6em;display:inline-block}
#cbar .cw b{font-family:var(--read)}
#cbar .etr{color:#555;font-size:.85em}
#ctools{position:fixed;top:8px;right:10px;opacity:.25;font-family:var(--ui);font-size:13px;display:flex;gap:8px;align-items:center;z-index:11}
#ctools:hover,#ctools.warn{opacity:1}
#ctools button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:3px 8px}
#cstat{color:#a33;font-size:18px}
@media (max-width:900px){.view.on{flex-direction:column}#panel{max-width:none;border-left:0;border-top:1px solid var(--line)}#text{padding:16px 16px 20vh}.doc{padding:16px}}
@media print{header,#banner,#editbar,#panel,.ed,#tip{display:none!important}main,.view.on{display:block;height:auto}#text{overflow:visible;padding:0}.doc{overflow:visible}
  .s,.s.read,.s.cur{color:#000!important;background:none!important;box-shadow:none!important}.w.spot{background:none!important;color:inherit!important;padding:0!important}}
</style>
</head>
<body>
<header>
  <div class="brand" title="Tamlilon · תמלילון — Created by Dinmo · a Yours Truly project"><!--logo--><svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#1f3d5c"/><path d="M19 8h27a7 7 0 0 1 7 7v6a7 7 0 0 1-7 7H31l-7 7v-7h-5a7 7 0 0 1-7-7v-6a7 7 0 0 1 7-7z" fill="#fff"/><rect x="19" y="15.5" width="22" height="5" rx="2.5" fill="#1f3d5c" opacity=".3"/><rect x="10" y="38" width="44" height="10" rx="5" fill="#f2b632"/><rect x="10" y="52" width="30" height="5" rx="2.5" fill="#fff" opacity=".5"/></svg><!--/logo--><div><b>Tamlilon</b><span lang="he" dir="rtl">תמלילון</span></div></div>
  <h1 id="ptitle">New lesson</h1><button class="ed" id="edtitle" title="Change the title">✎</button>
  <nav id="tabs"></nav>
  <div class="tools">
    <button id="fsm" title="Smaller text (−)">A−</button><button id="fsp" title="Bigger text (+)">A+</button>
    <button id="numb" title="Show / hide sentence numbers (#)">#</button>
    <button id="projb" title="Open the class screen, for the projector">📽️ Class screen <span id="projdot">○</span></button>
    <button id="saveb" title="Save the lesson as a file">💾 Save</button>
    <button id="pkgb" title="Make a read-only copy to send to someone else">📦 Package</button>
    <button id="editb" title="Edit mode (E)">✎ Edit</button>
    <button id="helpb" title="Step-by-step guide (?)">? Guide</button>
  </div>
</header>
<div id="banner"></div>
<div id="editbar">✎ <b>Editing is on.</b> Click any word to change its pop-up, or a yellow ✎ button. Double-click a tab to rename it. <button id="editdone">✓ Done editing</button></div>
<main>
  <section class="view" id="v-read"><div id="text"></div><aside id="panel"></aside></section>
  <section class="view" id="v-words"><div class="doc"><div class="inner" id="words"></div></div></section>
  <section class="view" id="v-setup"><div class="doc"><div class="inner" id="setup"></div></div></section>
</main>
<div id="classview">
  <div id="ctext"></div>
  <div id="cbar"></div>
  <div id="ctools"><span id="cstat"></span><button id="cfs" title="Full screen (F)">⛶ Full screen</button></div>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="modal"><div class="card" id="mcard"></div></div>

<!-- The lesson itself (text, translations, notes, tabs). Empty in the blank tool; filled in when you click 💾 Save. -->
<script id="lesson-data" type="application/json">null</script>
<script>
(function(){
"use strict";
// Copy of this page exactly as it was loaded, before anything is drawn: 💾 Save and 📦 Package write it back out
// with the current lesson inside the "lesson-data" block above.
const SNAP = document.documentElement.outerHTML;
const DATA_RX = /(<script id="lesson-data" type="application\/json">)[\s\S]*?(<\/script>)/;
const CLASS = new URLSearchParams(location.search).get("view")==="class";   // projector ("class") window?
let FILE=null; try{ FILE=JSON.parse(document.getElementById("lesson-data").textContent||"null"); }catch(e){}
const RO = !!(FILE && FILE.readonly);                                        // 📦 package: read-only

// ---------------------------------------------------------------- helpers
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
          del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);

const LANGCODE={french:"fr",français:"fr",english:"en",spanish:"es",español:"es",german:"de",deutsch:"de",italian:"it",italiano:"it",
  portuguese:"pt",dutch:"nl",russian:"ru",hebrew:"he",arabic:"ar",polish:"pl",romanian:"ro",catalan:"ca",swedish:"sv",turkish:"tr",greek:"el"};
function sentencesOf(p){
  let a=null;
  if(window.Intl && Intl.Segmenter){ try{
    a=[...new Intl.Segmenter(LANGCODE[(L.src||"").trim().toLowerCase()],{granularity:"sentence"}).segment(p)].map(x=>x.segment);
  }catch(e){} }
  if(!a) a=p.match(/(?:[^.!?…]|\.(?=\d))+(?:[.!?…]+["»”’)\]]*|$)/g)||[p];      // (older browsers) 3.5 and 2.000 are not cuts
  // Repairs: a closing » ” ) goes back to its sentence; « Ça va ? » dit-il. (the next part starts in lowercase) stays one
  // sentence; so does what follows M. / Mme / Dr. / Mr. or an initial (J.M.G. Le Clézio).
  const out=[];
  a.forEach(x=>{ const k=out.length-1;
    if(k>=0){ const c=x.match(/^\s*[»”’)\]]+/); if(c){ out[k]+=c[0]; x=x.slice(c[0].length); }
      if(/^\s*\p{Ll}/u.test(x) || /(?:^|[\s«(“".])(?:M|MM|Mme|Mlle|Dr|Pr|Mr|Mrs|Ms|St|Ste|\p{Lu})\.\s*$/u.test(out[k])){ out[k]+=x; return; } }
    out.push(x); });

// A word cut at the end of a line (text copied from a PDF): "s'appe-" + "lait" → "s'appelait". After a hyphen, these
// usual second halves keep it: peut-être, dit-il, a-t-elle, là-bas, celui-ci.
const KEEP_HYPHEN=/^(?:t|il|ils|elle|elles|on|je|tu|nous|vous|le|la|les|lui|leur|moi|toi|y|en|ce|ci|là|bas|être|même)$/i;
const dehyphen=p=>p.replace(/(\p{L})[-­‐][ \t]*\n\s*(\p{Ll}[\p{L}\p{M}]*)/gu,(m,a,b)=>a+(KEEP_HYPHEN.test(b)?"-":"")+b);

function splitText(txt){
  return txt.replace(/\r/g,"").split(/\n\s*\n/).map(p=>dehyphen(p).replace(/\s*\n\s*/g," ").replace(/[ \t]+/g," ").trim()).filter(Boolean)
    .map(p=>sentencesOf(p).join("\n")).join("\n\n");

const sentsToText=()=>L.sents.map((s,i)=>(i&&s.np?"\n":"")+s.t).join("\n");
// One line = one sentence; an empty line = new paragraph. Unchanged sentences keep their translations and notes.
function useText(txt){
  const out=[]; let np=true;
  txt.replace(/\r/g,"").split("\n").forEach(l=>{ l=l.trim(); if(!l){np=true;return;} out.push({t:l,np}); np=false; });
  const pool=new Map(); L.sents.forEach(s=>{ if(!pool.has(s.t)) pool.set(s.t,[]); pool.get(s.t).push(s); });
  let fresh=0; const kept=new Set();
  const next=out.map(o=>{ const old=(pool.get(o.t)||[]).shift(); if(old){ kept.add(old); old.np=o.np; return old; } fresh++; return {t:o.t,np:o.np,tr:[],n:[]}; });
  // As many lines changed as were taken away: they were edited (a typo fixed), so they keep their notes, in order.
  // Their translations go to the archive and are asked again.
  const gone=L.sents.filter(s=>!kept.has(s)), added=next.filter(s=>!kept.has(s)), edited=gone.length===added.length;
  gone.forEach((s,i)=>{ if(edited) added[i].n=s.n||[];
    if((s.tr||[]).some(Boolean)||(!edited&&(s.n||[]).length)) L.removed.push({when:Date.now(),sentence:s}); });
  L.sents=next; cur=Math.min(cur,Math.max(0,L.sents.length-1)); return fresh;
}

// ---------------------------------------------------------------- the prompt for the AI, and reading its answer
function promptFor(){
  const mw=new Set(missW()), S=L.batch?missS().slice(0,L.batch):missS(); let W=[], ctx=[];
  if(S.length){ const seen=new Set(); S.forEach(i=>toks(L.sents[i].t).forEach(k=>{ if(mw.has(k)&&!seen.has(k)){ seen.add(k); W.push(k); } })); W=W.slice(0,400); }
  else{ W=[...mw].slice(0,400); const V=vocab(); ctx=[...new Set(W.map(k=>V.get(k).first))].slice(0,40); }
  if(!S.length && !W.length) return null;
  const LG=L.langs, src=L.src||"the original language";
  const pr=PR();
  let p=`I am preparing a reading lesson in ${src} for students who speak ${LG.join(" and ")}.\n`+
    `Please translate the ${S.length?(W.length?"sentences and the words":"sentences"):"words"} listed below.\n\n`+
    `Reply ONLY with lines in this exact format, and nothing else (no introduction, no headings, no tables, no bold, no comments). Put all the lines inside ONE code block, one item per line:\n\n`;
  if(S.length) p+=`S<number> | ${LG.map(l=>`<${l} translation>`).join(" | ")}\n`;
  if(W.length) p+=`W | <the word, copied exactly> | ${LG.map(l=>`<${l} meaning>`).join(" | ")}${pr.map(sc=>` | <pronunciation in ${sc} letters>`).join("")}\n`;
  p+=`\nRules:\n`;
  if(S.length) p+=`- Write one S line for each sentence, with its number. Translate the whole sentence, naturally and faithfully.\n`;
  if(W.length) p+=`- Write one W line for each word, copying the word exactly as it is in the list. Give the meaning it has in these sentences, in 1 to 4 words. If it is an inflected form (a conjugated verb, a plural, a feminine form...), add its dictionary form in brackets.\n`;
  if(W.length && pr.length) p+=`- Pronunciation: how to say the ${src} word, ${pr.map(sc=>`written in ${sc} letters`).join(", then ")}. In Latin letters, write the stressed syllable in CAPITALS.\n`;
  p+=`- Use the | character only as a separator.\n- After the last line, write a line with only the word END.\n`;
  asked=new Map(S.map(i=>[i+1,L.sents[i].t]));
  if(S.length) p+=`\nSENTENCES (${S.length}):\n`+S.map(i=>`S${i+1} = ${L.sents[i].t}`).join("\n")+"\n";
  if(ctx.length) p+=`\nFor context only (do NOT translate these sentences):\n`+ctx.map(i=>L.sents[i].t).join("\n")+"\n";
  if(W.length) p+=`\nWORDS (${W.length}):\n`+W.join("\n")+"\n";

// The sentences the last prompt asked for (S number → text), so an answer still lands on the right sentence
// if the text was changed between copying the prompt and pasting the answer.
let asked=null;
// Reads any pasted AI answer. Tolerant: ignores chatter, bullets, bold, code fences and table bars; merges what it finds.
// It only fills what is empty: a translation you corrected by hand is never replaced.
function parseAnswer(txt){
  const r={s:0,w:0,bad:0,end:false}, V=vocab(), n=L.langs.length;
  // One value: drop `code` and **bold** / *italic* around it, and quote marks only when they wrap the whole value
  // ("Hello," he said. keeps its quotes). keepQ: the original sentence itself is a quotation, so keep them.
  const clean=(x,keepQ)=>{ x=(x||"").trim().replace(/^`+|`+$/g,"").trim().replace(/^\*{1,2}([^*]+)\*{1,2}$/,"$1").trim();
    const q=!keepQ && x.match(/^["“«]\s*([^"“”«»]*?)\s*["”»]$/); return q?q[1]:x; };
  txt=txt.replace(/\r/g,"").replace(/\\([\[\]()*_#`~>|.!{}+-])/g,"$1");          // "\[faire\]" → "[faire]" (escapes added by the chat's copy)
  // ChatGPT shows the lines as one paragraph, so its copy can glue all the S / W lines into one. Only if the answer is
  // glued like that (far more records than lines starting with one), cut it again, and only before a real record:
  // S + the next sentence number, or W + a word of the text. So "S1", "W", "END" inside a translation stay as they are.
  const REC=/(?:^|\s)(?:\*\*)?(?:S\s*\d+|W)\s*(?:\*\*)?\s*\|/g;
  const recs=(txt.match(REC)||[]).length, starts=txt.split("\n").filter(x=>/^[\s\-*•>|`]*(?:\d+[.)]\s*)?(?:\*\*)?(?:S\s*\d+|W)\s*(?:\*\*)?\s*\|/.test(x)).length;
  if(recs>=2*Math.max(1,starts)){
    let lastS=0;
    txt=txt.replace(/(\|?)[ \t]+END[ \t]*$/gm,(m,bar)=>bar?m:"\nEND")              // a glued line's final END, but not "| END" (a translation that is END)
      .replace(/^/gm," ")                                                             // so a record at the start of a line is counted too
      .replace(/[ \t]+(?=(?:\*\*)?(?:S\s*(\d+)\s*(?:\*\*)?\s*\||W\s*(?:\*\*)?\s*\|\s*([^|]*?)\s*\|))/g,(m,sn,w)=>{
      if(sn){ const k=+sn; if(k>lastS && k<=L.sents.length){ lastS=k; return "\n"; } return m; }
      return V.has(norm(clean(w))) ? "\n" : m; });
  }
  txt.split("\n").forEach(raw=>{
    let l=raw.replace(/[‎‏‪-‮⁦-⁩]/g,"").replace(/｜/g,"|").trim();
    l=l.replace(/^`+|`+$/g,"").replace(/^\|\s*/,"").replace(/\s*\|$/,"").replace(/^(?:[-*•>]+|\d+[.)])\s+/,"").trim();
    if(!l) return;
    if(/^\**END\**$/.test(l)){ r.end=true; return; }                              // END alone on its line
    let m=l.match(/^\**\s*S\s*(\d+)\s*\**\s*([|:=.)–—-])\s*(?:\*\*\s)?\s*(.*)$/i);   // also **S1:** and **S1 |**
    if(m){ const q=asked&&asked.get(+m[1]), at=L.sents[+m[1]-1];
      const s=q==null||(at&&at.t===q)?at:L.sents.find(x=>x.t===q);                      // the text changed since the prompt: find it by text
      const parts=m[3].split("|").map(p=>clean(p,s&&/^["“«]/.test(s.t)));
      const same=a=>!!s && norm(a).replace(/[^\p{L}\p{N}]/gu,"")===norm(s.t).replace(/[^\p{L}\p{N}]/gu,"");
      if(parts.length>n && same(parts[0])) parts.shift();                             // a table that repeats the original sentence first
      if(!s || !parts[0] || (m[2]==="=" && same(parts[0]))){ r.bad++; return; }       // "S1 = …" is the prompt's own line
      s.tr=L.langs.map((_,j)=>((s.tr||[])[j]||"").trim()||parts[j]||""); r.s++; return; }
    m=l.match(/^\**\s*W\s*\**\s*[|:]\s*(?:\*\*\s)?\s*(.*)$/i);
    if(m){ const parts=m[1].split("|").map(p=>clean(p)), k=norm(parts[0]).replace(/[.,;:!?]+$/,"");
      if(!V.has(k) || !parts[1]){ r.bad++; return; }
      const w=L.words[k]||{tr:[],p:{},n:""};
      w.tr=L.langs.map((_,j)=>((w.tr||[])[j]||"").trim()||parts[1+j]||""); w.p=w.p||{};
      PR().forEach((sc,j)=>{ if(parts[1+n+j] && !(w.p[sc]||"").trim()) w.p[sc]=parts[1+n+j]; });
      L.words[k]=w; r.w++; return; }
    if(/^(S\s*\d|W\s*\|)/i.test(l)) r.bad++;
  });
  return r;
}

// ---------------------------------------------------------------- words: tokenizer and pop-ups
function tokenize(text){
  let h="",last=0;
  for(const m of String(text).matchAll(WRX)){ h+=esc(text.slice(last,m.index))+`<span class="w" data-k="${esc(norm(m[0]))}">${esc(m[0])}</span>`; last=m.index+m[0].length; }

// Pop-ups inside notes and your tabs: wraps every word that has a translation. Translations themselves are skipped.
const SKIP=".w,[dir],button,.tag,.meta,.ed,kbd,.lab,input,textarea,select";
function wordify(root){
  if(!root) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest(SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{ const t=n.nodeValue, frag=document.createDocumentFragment(); let last=0, hit=false;
    for(const m of t.matchAll(WRX)){ const k=norm(m[0]); if(!L.words[k]) continue; hit=true; frag.append(t.slice(last,m.index));
      const sp=document.createElement("span"); sp.className="w"; sp.dataset.k=k; sp.textContent=m[0]; frag.append(sp); last=m.index+m[0].length; }
    if(hit){ frag.append(t.slice(last)); n.replaceWith(frag); } });

function markSpot(){

function go(i){

// ---------------------------------------------------------------- editors: sentence, translation, notes
function editSentence(){
  const i0=cur, s=L.sents[i0];
  openEditor(`Sentence ${i0+1}`,[{k:"t",label:"Text",val:s.t,rows:4,help:"Press Enter to cut it into two sentences. Empty = remove the sentence."}],
    v=>{
      const parts=v.t.split("\n").map(x=>x.trim()).filter(Boolean), np=v.enp!=null?v.enp:s.np;
      if(!parts.length){ if(!confirm("Remove this sentence? (Its translation and notes are kept in the file's archive.)")) return;
        L.removed.push({when:Date.now(),sentence:s}); L.sents.splice(i0,1); cur=Math.max(0,Math.min(i0,L.sents.length-1));
        CST.word=null; CST.show={t:false,n:false}; touch(); if(L.sents.length) go(cur); else sendState(); return; }       // start clean on the next sentence (and on the class screen)
      if(parts.length==1){ s.t=parts[0]; s.np=np; touch(); go(i0); return; }
      L.removed.push({when:Date.now(),sentence:JSON.parse(JSON.stringify(s))});
      const news=parts.map((t,j)=>({t,np:j==0?np:false,tr:[],n:j==0?s.n:[]}));
      L.sents.splice(i0,1,...news); touch(); go(i0);
      toast(`Cut into ${parts.length} sentences. Their translations are missing now: ✨ Setup → 📋 Copy the next prompt.`,6000);
    },
    {top:`<label style="font-weight:normal"><input type="checkbox" id="enp" ${s.np?"checked":""}> This sentence starts a new paragraph</label>`+
      (i0<L.sents.length-1?`<p><button id="ejoin" style="border:1px solid #bbb;background:#fff;border-radius:8px;padding:5px 12px">⤵ Join with the next sentence</button></p>`:"")});
  const j=$("ejoin"); if(j) j.onclick=()=>{          // uses what is typed in the box; a translation is kept only if both halves have one
    const n=L.sents[i0+1]; L.removed.push({when:Date.now(),sentence:JSON.parse(JSON.stringify(s))},{when:Date.now(),sentence:n});
    s.t=($("ef0").value.replace(/\s*\n\s*/g," ").trim()||s.t)+" "+n.t; s.np=$("enp").checked;
    s.tr=L.langs.map((_,k)=>{ const a=(s.tr||[])[k], b=(n.tr||[])[k]; return a&&b?a+" "+b:""; }); s.n=(s.n||[]).concat(n.n||[]);
    L.sents.splice(i0+1,1); closeModal(); touch(); go(i0); };
}
function editTrans(){
  const i0=cur, s=L.sents[i0];
  openEditor(`Sentence ${i0+1}: translation`,L.langs.map((lg,j)=>({k:"t"+j,label:lg,val:(s.tr||[])[j]||"",rows:3})),
    v=>{ s.tr=L.langs.map((_,j)=>v["t"+j].trim()); touch(); },{top:`<div class="src">${esc(s.t)}</div>`});
}
function editNotes(){
  const i0=cur, s=L.sents[i0]; let list=(s.n||[]).map(n=>n.slice()), focus=null;
  const words=[...new Set(s.t.match(WRX)||[])];
  const sync=()=>mcard.querySelectorAll(".ncard").forEach(c=>{ const j=+c.dataset.j; list[j]=[c.querySelector("select").value,c.querySelector("textarea").value]; });
  const selectDots=ta=>{ const k=ta.value.indexOf("…"); ta.focus(); if(k>=0) ta.setSelectionRange(k,k+1); };
  function draw(fj){
    openModal(`<h2>Notes for sentence ${i0+1}</h2><div class="src">${esc(s.t)}</div>
      <div id="nlist">${list.map((n,j)=>`<div class="ncard" data-j="${j}"><div class="nhead">
        <select title="Kind of note">${NOTE_TYPES.map(t=>`<option value="${t[0]}" ${t[0]==n[0]?"selected":""}>${t[1]}</option>`).join("")}</select>
        <button data-fmt="**" title="Bold: select some text, then click"><b>B</b></button><button data-fmt="*" title="Italic: select some text, then click"><i>I</i></button>
        <span class="sp"></span>${j?`<button data-up="${j}" title="Move up">↑</button>`:""}<button data-del="${j}" title="Remove this note">🗑️</button></div>
        <textarea dir="auto" rows="3">${esc(n[1])}</textarea></div>`).join("")||`<p class="meta">No notes yet. Choose a kind of note below.</p>`}</div>
      <div class="lab2">Add a note:</div>
      <div class="presets">${NOTE_TYPES.map(t=>`<button data-add="${t[0]}">${t[1]}</button>`).join("")}</div>
      <div class="lab2">Words of the sentence <span class="help" style="font-weight:normal;color:var(--muted)">click one to put it (in bold) in the note you are writing</span></div>
      <div class="chips">${words.map(w=>`<button data-chip="${esc(w)}">${esc(w)}</button>`).join("")}</div>
      <p class="meta">In the text, **word** shows as <b>word</b> and *word* as <i>word</i>. Replace each … with your own words.</p>
      <div class="row"><button id="ecan">Cancel</button><button class="primary" id="esave">Save notes</button></div>`);
    mcard.querySelectorAll(".ncard textarea").forEach((ta,j)=>ta.addEventListener("focus",()=>focus=j));
    mcard.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ sync(); const t=NOTE_TYPES.find(x=>x[0]==b.dataset.add); list.push([t[0],t[2]]); draw(list.length-1); });
    mcard.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ sync(); list.splice(+b.dataset.del,1); focus=null; draw(); });
    mcard.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ sync(); const j=+b.dataset.up; [list[j-1],list[j]]=[list[j],list[j-1]]; draw(j-1); });
    mcard.querySelectorAll("[data-fmt]").forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{
      const ta=b.closest(".ncard").querySelector("textarea"), f=b.dataset.fmt, a=ta.selectionStart, z=ta.selectionEnd, sel=ta.value.slice(a,z)||"…";
      ta.value=ta.value.slice(0,a)+f+sel+f+ta.value.slice(z); ta.focus(); ta.setSelectionRange(a+f.length,a+f.length+sel.length); }; });
    mcard.querySelectorAll("[data-chip]").forEach(b=>{ b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{
      const tas=mcard.querySelectorAll(".ncard textarea"); let ta=tas[focus!=null?focus:tas.length-1];
      if(!ta){ sync(); list.push(["expr","**…** means …"]); draw(list.length-1); ta=mcard.querySelectorAll(".ncard textarea")[list.length-1]; }
      const word="**"+b.dataset.chip+"**";
      if(ta.value.includes("**…**")) ta.value=ta.value.replace("**…**",word);
      else{ const a=ta.selectionStart, z=ta.selectionEnd; ta.value=ta.value.slice(0,a)+word+ta.value.slice(z); }
      selectDots(ta); }; });
    $("ecan").onclick=closeModal;
    $("esave").onclick=()=>{ sync(); s.n=list.filter(n=>{ const v=n[1].trim(); return v && v!="…" && !NOTE_TYPES.some(t=>t[2]==v); });   // untouched presets are dropped
      closeModal(); open.n=true; touch(); };
    if(fj!=null){ const ta=mcard.querySelectorAll(".ncard textarea")[fj]; if(ta){ focus=fj; selectDots(ta); } }
  }
  draw();
}

    $("copymsg").textContent=ok?`✓ Copied (${P.s?P.s+" sentences, ":""}${P.w} words). Now paste it in the AI chat.`:"⚠ Could not copy: open “More options → Show the prompt” and copy it from there.";
  };
  if($("showp")) $("showp").onclick=()=>{ const P=promptFor(); const t=$("ptext"); t.value=P?P.p:""; t.style.display=""; t.select(); };
  const ans=$("answer");

// Translations are kept by position (one per language), so when the languages change, each column moves with its language.
// A language that is taken away goes to the archive (L.removed) and comes back if it is added again.
function setLangs(list){
  const lc=x=>x.toLowerCase(), at=(arr,l)=>arr.findIndex(o=>lc(o)==lc(l));
  const neu=list.filter((l,i,a)=>l&&at(a,l)==i), old=L.langs; if(!neu.length) neu.push("English");
  if(neu.length==old.length && neu.every((l,j)=>lc(l)==lc(old[j]))){ L.langs=neu; return; }
  const secs=()=>Object.fromEntries(Object.values(L.tabs.custom).flatMap(tb=>(tb.secs||[]).map(x=>[x.id,x.tr||[]])));
  if(old.some(o=>at(neu,o)<0)) L.removed.push({when:Date.now(),langs:old.slice(),sents:L.sents.map(s=>({t:s.t,tr:s.tr})),
    words:Object.fromEntries(Object.entries(L.words).map(([k,w])=>[k,w.tr])),secs:secs()});
  const back=(l,key)=>{ const A=[...L.removed].reverse().find(x=>x.langs&&at(x.langs,l)>=0); if(!A) return "";
    const tr=key.s!=null?(A.sents.find(x=>x.t===key.s)||{}).tr:key.w!=null?A.words[key.w]:(A.secs||{})[key.sec];
    return (tr||[])[at(A.langs,l)]||""; };
  const col=(tr,key)=>neu.map(l=>{ const j=at(old,l); return j>=0?((tr||[])[j]||""):back(l,key); });
  L.sents.forEach(s=>s.tr=col(s.tr,{s:s.t}));
  Object.entries(L.words).forEach(([k,w])=>w.tr=col(w.tr,{w:k}));
  Object.values(L.tabs.custom).forEach(tb=>(tb.secs||[]).forEach(x=>x.tr=col(x.tr,{sec:x.id})));
  L.langs=neu;
}
function addAnswer(t){
  const r=parseAnswer(t), left=missS().length+missW().length;
  if(!r.s && !r.w && /Reply ONLY with lines in this exact format/.test(t)){ ansMsg="⚠ This is the prompt, not the AI's answer. Paste the prompt in the AI chat, then copy the AI's answer and paste that here."; renderSetup(); return; }
  if(!r.s && !r.w) ansMsg="⚠ I found no translations in what you pasted. Copy the AI's whole answer (its lines start with S or W) and paste again. If the AI wrote something else, tell it: “Please answer only with the lines in the format I asked.”";
  else ansMsg=`✓ Added ${[r.s?`${r.s} sentence translation${r.s>1?"s":""}`:"",r.w?`${r.w} word${r.w>1?"s":""}`:""].filter(Boolean).join(" and ")}.`+(r.bad?` (${r.bad} line${r.bad>1?"s were":" was"} not understood and ${r.bad>1?"were":"was"} skipped.)`:"")+
    (left?(!r.end?" The answer seems cut off: no problem, what is missing goes into the next prompt.":"")+" Next: click 📋 Copy the next prompt again.":" All done!");
  touch();
}
function dropText(el,fn){   // drag a .txt file onto a box

}

let classWin=null, lastHello=0;
const classAlive=()=>Date.now()-lastHello<3000;
function sendState(){ if(classWin) try{ classWin.postMessage({ns:"lm",type:"state",st:{cur,show:CST.show,word:CST.word}},"*"); }catch(e){} }
function sendLesson(){ if(classWin) try{ classWin.postMessage({ns:"lm",type:"lesson",L:JSON.parse(JSON.stringify(L))},"*"); }catch(e){} }
function setCST(ch){ Object.assign(CST,ch); renderPanel(); sendState(); }
function toggleClass(id){ setCST({show:Object.assign({},CST.show,{[id]:!CST.show[id]})}); }
function updProj(){ const d=$("projdot"), on=classAlive(); d.textContent=on?"●":"○"; d.classList.toggle("on",on); }
if(!CLASS){
  window.addEventListener("message",e=>{
    const d=e.data; if(!d||d.ns!=="lm") return;
    if(d.type==="hello"){ const first=!classAlive(); classWin=e.source; lastHello=Date.now(); if(d.have!==(L.t||1)) sendLesson(); sendState(); updProj(); if(first) renderPanel(); }
    else if(d.type==="key" && e.source===classWin && !["?","e","E"].includes(d.key) && d.code!=="KeyE") handleKey({key:d.key,code:d.code,shiftKey:d.shift,target:document.body,preventDefault(){}});
  });
  setInterval(()=>{ const was=$("projdot").classList.contains("on"); updProj(); if(was!==classAlive()) renderPanel(); },1000);
  $("projb").onclick=()=>{
    if(!L.sents.length){ alert("Add a text first (✨ Setup)."); return; }
    if(classWin && !classWin.closed && classAlive()){ try{ classWin.focus(); }catch(e){} return; }
    const w=window.open(location.href.split(/[?#]/)[0]+"?view=class","lm_class","popup=yes,width=1200,height=800");
    if(w) classWin=w; else alert("The browser blocked the window. Allow pop-ups for this file, then click 📽️ again.");
  };
}
function classMain(){
  document.body.classList.add("classmode"); document.title="Class screen";
  const ctext=$("ctext"), cbar=$("cbar"), cstat=$("cstat");
  let cfs=ls.get("lm_cfs",40); const setC=v=>{ cfs=Math.max(20,Math.min(90,v)); document.documentElement.style.setProperty("--cfs",cfs+"px"); ls.set("lm_cfs",cfs); }; setC(cfs);
  let have=0, st=null, cs=[], last="", lastCur=-1, lastState=0;
  function build(){
    let h="<p>"; L.sents.forEach((s,i)=>{ if(i&&s.np) h+="</p><p>"; h+=`<span class="s" data-i="${i}">${tokenize(s.t)}</span> `; });
    ctext.innerHTML=h+"</p>"; cs=[...ctext.querySelectorAll(".s")]; last=""; lastCur=-1; renderTitle();
  }
  function render(){
    if(!have||!st) return; const s=L.sents[st.cur];
    if(!s){ cbar.innerHTML=""; last=""; cs.forEach(sp=>sp.classList.remove("cur","read")); return; }   // no sentence (all removed): clear the bar
    const key=JSON.stringify(st); if(key===last) return; last=key;
    cs.forEach((sp,k)=>{ sp.classList.toggle("cur",k==st.cur); sp.classList.toggle("read",k<st.cur); sp.querySelectorAll(".w.spot").forEach(w=>w.classList.remove("spot")); });
    const ws=[...cs[st.cur].querySelectorAll(".w")];
    if(st.word && ws[st.word.i]) ws[st.word.i].classList.add("spot");
    let bar="";
    if(st.word){ const g=L.words[st.word.k]||{tr:[]}; bar+=`<div class="row"><span class="cw"><b>${esc(st.word.f)}</b> = ${L.langs.map((_,j)=>g.tr[j]?`<span dir="auto">${esc(g.tr[j])}</span>`:"").filter(Boolean).join(" · ")||"?"} ${pronVals(g).some(Boolean)?`<span class="etr">🔊 ${pronVals(g).filter(Boolean).map(v=>`<span dir="auto">${esc(v)}</span>`).join(" · ")}</span>`:""}</span></div>`; }
    if(st.show.t) bar+=`<div class="row">${L.langs.map((_,j)=>(s.tr||[])[j]?`<div class="ctr" dir="auto">${esc(s.tr[j])}</div>`:"").join("")}</div>`;
    if(st.show.n) bar+=`<div class="row"><span class="lab">Notes</span><ul class="notes">${(s.n||[]).map(n=>`<li>${tagH(n[0])}${md(n[1])}</li>`).join("")||"<li>—</li>"}</ul></div>`;
    cbar.innerHTML=bar;
    if(st.cur!==lastCur){ lastCur=st.cur; }
    requestAnimationFrame(()=>cs[st.cur].scrollIntoView({block:"center",behavior:"smooth"}));
  }
  window.addEventListener("message",e=>{ const d=e.data; if(!d||d.ns!=="lm"||e.source!==window.opener) return;
    if(d.type==="lesson"){ L=fix(d.L); have=L.t||1; build(); }
    if(d.type==="state"){ lastState=Date.now(); st=d.st; }
    render(); });
  const hello=()=>{ if(window.opener && !window.opener.closed) try{ window.opener.postMessage({ns:"lm",type:"hello",have},"*"); }catch(e){} };
  hello(); setInterval(hello,1000);
  setInterval(()=>{ cstat.textContent=!window.opener?"Open this screen from the lesson page (📽️ Class screen).":(Date.now()-lastState<3000?"":"⚠ not linked to the lesson page"); $("ctools").classList.toggle("warn",!!cstat.textContent); },1000);
  const fsb=()=>{ if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document); else (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement); };
  $("cfs").onclick=fsb;
  document.addEventListener("keydown",e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key=="+"||e.key=="=") return setC(cfs+4); if(e.key=="-") return setC(cfs-4);
    if(e.key=="f"||e.key=="F"||e.code=="KeyF") return fsb();
    if([" ","ArrowRight","ArrowLeft","ArrowUp","ArrowDown","PageUp","PageDown"].includes(e.key)) e.preventDefault();
    if(window.opener) try{ window.opener.postMessage({ns:"lm",type:"key",key:e.key,code:e.code,shift:e.shiftKey},"*"); }catch(err){}
  });
}

// ---------------------------------------------------------------- keys
function handleKey(e){
  // With a Hebrew (or other non-Latin) keyboard, a letter key counts as the Latin key at the same place: א is T, ק is E.
  // On a French (AZERTY) keyboard the top-row keys count as 1…9 without Shift.
  const c=e.code||"", k=/^[^\x00-\x7f]$/.test(e.key||"")&&/^Key[A-Z]$/.test(c)?c.slice(3).toLowerCase():e.key, low=(k||"").toLowerCase(), tl=tabList();
  const dg=/^[1-9]$/.test(k)?k:(!e.shiftKey&&/^Digit[1-9]$/.test(c)?c.slice(5):null);
  if(dg){ if(tl[+dg-1]) show(tl[+dg-1].id); return; }
  if(k=="+"||k=="=") return setFs(fs+2); if(k=="-") return setFs(fs-2);
  if(k=="#") return toggleNums();
  if(k=="?") return showGuide();
  if(low=="e" && !RO) return toggleEdit();
  if(k=="Escape"){ if(CST.word||CST.show.t||CST.show.n) setCST({word:null,show:{t:false,n:false}}); return; }
  if(view!="read"||!L.sents.length) return;
  if(k=="ArrowRight"||k==" "||k=="ArrowDown"||k=="PageDown"){ e.preventDefault(); go(cur+1); }
  else if(k=="ArrowLeft"||k=="ArrowUp"||k=="PageUp"){ e.preventDefault(); go(cur-1); }
  else if(low=="t"||low=="n"){ if(e.shiftKey) toggleClass(low); else toggle(low); }
  else if(k=="Home") go(0); else if(k=="End") go(L.sents.length-1);
}
if(!CLASS) document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(modal.classList.contains("on")){ if(e.key=="Escape" && modalSoft) closeModal(); return; }
  const a=document.activeElement||{};                // typing in a field: not a shortcut (a ticked checkbox does not count)
  if(/^(TEXTAREA|SELECT)$/.test(a.tagName||"")||a.isContentEditable||(a.tagName=="INPUT"&&!/^(checkbox|radio|button|submit|reset)$/i.test(a.type))) return;
  handleKey(e);
});

// ---------------------------------------------------------------- start
if(CLASS){ classMain(); return; }
cur=Math.min(ls.get("lm:cur:"+L.id,0),Math.max(0,L.sents.length-1));
view=L.sents.length?ls.get("lm:view:"+L.id,"read"):(RO?"read":"setup");
renderAll(); if(L.sents.length) go(cur);
})();
</script>
